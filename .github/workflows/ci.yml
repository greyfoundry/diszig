name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Zig 0.17.1 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          version=0.17.1
          archive="zig-x86_64-linux-$version.tar.xz"
          curl -fsSLo "$archive" "https://ziglang.org/download/$version/$archive"
          echo "3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a  $archive" | sha256sum -c -
          tar -xJf "$archive"
          echo "$PWD/zig-x86_64-linux-$version" >> "$GITHUB_PATH"

      - name: Install Zig 0.17.1 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '0.17.1'
          $archive = "zig-x86_64-windows-$version.zip"
          Invoke-WebRequest -Uri "https://ziglang.org/download/$version/$archive" -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne 'b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e') {
            throw 'Zig archive hash mismatch'
          }
          Expand-Archive -Path $archive -DestinationPath .
          "$PWD\zig-x86_64-windows-$version" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test and package gates
        shell: bash
        run: |
          set -euo pipefail
          zig version
          zig fmt --check $(git ls-files '*.zig')
          zig build check
          zig build test -Doptimize=ReleaseSafe
